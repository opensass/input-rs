[package]
name = "yew-input-rs"
version = "0.1.0"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
input-rs = { path = "../..", features = ["yew"] }
regex = { version = "1.13.1", default-features = false }
reqwasm = { version = "0.5.0", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
wasm-bindgen = { version = "0.2.129", default-features = false }
wasm-bindgen-futures = { version = "0.4.79", default-features = false }
web-sys = { version = "0.3.106", default-features = false }
yew = { version = "0.23.0", features = ["csr"], default-features = false }
yew-router = { version = "0.20.0", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "thin"
strip = "symbols"
